# Usage:
#   cp .env.example .env            # add GEMINI_API_KEY
#   docker compose up -d qdrant
#   docker compose run --rm ingest  # one-off: download DB + build the vector index
#   docker compose up -d api ui     # UI on http://localhost:8501
#
# In Docker, Qdrant runs as a server (QDRANT_URL), so ingestion and the API
# can access it at the same time.

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  env_file: .env
  environment:
    QDRANT_URL: http://qdrant:6333
    SQLITE_DB_PATH: /app/customer_support_chat/data/travel2.sqlite
    HF_HOME: /app/customer_support_chat/data/hf-cache
  volumes:
    - app-data:/app/customer_support_chat/data
  networks:
    - app-network

services:
  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant-storage:/qdrant/storage
    networks:
      - app-network

  ingest:
    <<: *app
    command: ["python", "scripts/ingest.py"]
    depends_on:
      - qdrant
    profiles: ["tools"]

  api:
    <<: *app
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  ui:
    <<: *app
    command: ["streamlit", "run", "streamlit_app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api

networks:
  app-network:

volumes:
  app-data:
  qdrant-storage:
