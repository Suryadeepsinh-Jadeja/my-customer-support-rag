[project]
name = "travel-ai-backend"
version = "0.1.0"
description = "AI travel support and booking platform: API backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "pyjwt>=2.8",
    "argon2-cffi>=23.1",
    "pgvector>=0.3",
    "python-multipart>=0.0.9",
    "cryptography>=42",
    "boto3>=1.34",
    "google-genai>=1.0",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "pillow>=10.3",
    "pytesseract>=0.3.10",
    "redis>=5",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.20",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "fakeredis>=2.23",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["B008"]  # FastAPI's Depends() in argument defaults

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "ASYNC240"]
"app/rag/ingest.py" = ["ASYNC240"]  # one-off CLI
"alembic/*" = ["E501", "UP", "I"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
