[tool.poetry]
name = "customer-support-chat"
version = "1.0.0"
description = "Multi-agent RAG customer support assistant (LangGraph + Gemini + Qdrant)"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [
    { include = "customer_support_chat" },
    { include = "vectorizer" },
]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
# Agents / LLM
langgraph = "^1.2"
langchain-core = "^1.6"
langchain-text-splitters = "^1.1"
# >=4 converts Optional/Union tool arguments correctly (older versions printed
# "Key 'anyOf' is not supported in schema, ignoring" and dropped the type info).
langchain-google-genai = "^4.4"
# RAG
qdrant-client = "^1.19"            # uses query_points(); search() was removed
sentence-transformers = "^6.1"     # embeddings + cross-encoder reranker
# API / UI
fastapi = ">=0.115"
uvicorn = { version = ">=0.30", extras = ["standard"] }
streamlit = "^1.40"
requests = "^2.32"
# Data / utilities
python-dotenv = "^1.0.1"
pandas = ">=2.2.2"
pytz = ">=2024.1"
tqdm = "^4.66.5"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3"
httpx = ">=0.27"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
