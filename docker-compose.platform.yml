# AI Travel Platform (new stack: Next.js + FastAPI + PostgreSQL/pgvector + MinIO).
#
#   cp backend/.env.example backend/.env      # set JWT_SECRET and STORAGE_ENCRYPTION_KEY
#   docker compose -f docker-compose.platform.yml up -d --build
#
#   Frontend       http://localhost:3000
#   API docs       http://localhost:8000/docs
#   MinIO console  http://localhost:9001
#
# With malware scanning (ClamAV needs ~1.5 GB RAM and a few minutes to load signatures):
#   MALWARE_SCANNER=clamav docker compose -f docker-compose.platform.yml --profile scan up -d
#
# The backend applies database migrations and ingests ./knowledge_base on start-up.

name: travel-ai-platform

x-backend: &backend
  build: ./backend
  env_file: ./backend/.env
  environment: &backend-env
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-travel}:${POSTGRES_PASSWORD:-travel}@postgres:5432/${POSTGRES_DB:-travel}
    STORAGE_BACKEND: s3
    OBJECT_STORAGE_ENDPOINT: http://minio:9000
    OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-travel}
    OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-travel-dev-secret}
    OBJECT_STORAGE_BUCKET: travel-documents
    WORKER_MODE: external
    MALWARE_SCANNER: ${MALWARE_SCANNER:-none}
    CLAMAV_HOST: clamav
    REDIS_URL: redis://redis:6379/0
  depends_on: &backend-deps
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio-init:
      condition: service_completed_successfully

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-travel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-travel}
      POSTGRES_DB: ${POSTGRES_DB:-travel}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Shared rate limits for every API process.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-travel}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-travel-dev-secret}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-off: create the private documents bucket.
  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing local/travel-documents &&
        mc anonymous set none local/travel-documents
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-travel}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-travel-dev-secret}

  clamav:
    image: clamav/clamav:stable
    profiles: ["scan"]
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      start_period: 300s
      retries: 5

  backend:
    <<: *backend
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "true"
    volumes:
      - ./knowledge_base:/app/knowledge_base:ro
    ports:
      - "127.0.0.1:8000:8000"

  # Processes uploaded documents (scan, OCR, extraction) off the request path.
  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "false"
    depends_on:
      <<: *backend-deps
      backend:
        condition: service_healthy
    healthcheck:
      disable: true

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
